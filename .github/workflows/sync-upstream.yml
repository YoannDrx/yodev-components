name: Sync Frontend Joe pinned collections

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-frontend-joe-pinned
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.30.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Refresh five allow-listed repositories
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_PENDING: "1"
        run: pnpm catalog:sync && pnpm generate:ports && pnpm catalog:check && pnpm typecheck && pnpm test && pnpm build
      - name: Prepare sync branch
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/sync-frontend-joe
          git add -- content/components.json components/library/ports.generated.tsx components/library/loaders.generated.ts ATTRIBUTIONS.generated.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync Frontend Joe pinned collections"
            git push --force-with-lease "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" chore/sync-frontend-joe
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create upstream-sync --color 5B45E0 --description "Pinned component collection refresh" --force
          if gh pr view chore/sync-frontend-joe >/dev/null 2>&1; then
            gh pr edit chore/sync-frontend-joe --title "chore: sync Frontend Joe pinned collections" --add-label upstream-sync
          else
            gh pr create --base main --head chore/sync-frontend-joe --title "chore: sync Frontend Joe pinned collections" --body "Automated detection for the five allow-listed component repositories. New and changed ports require manual review; no auto-merge." --label upstream-sync
          fi
